<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>외식운영팀 식대 관리 시스템</title>

<!-- Supabase JS Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* McDonald's Theme Palette */
:root {
    --mcd-red: #DA291C;
    --mcd-yellow: #FFBC0D;
    --mcd-dark-red: #B3190D;
    --mcd-bg: #F4F4F4;
    --mcd-text: #27251F;
    --mcd-card-bg: #FFFFFF;
    --mcd-gray: #E0E0E0;
    --mcd-dark-gray: #4D4D4D;
}

* {
    box-sizing: border-box;
    font-family: 'Speedee', 'Malgun Gothic', '맑은 고딕', sans-serif;
}

body {
    background-color: var(--mcd-bg);
    margin: 0;
    padding: 0;
    color: var(--mcd-text);
}

header {
    background-color: var(--mcd-red);
    color: white;
    padding: 20px 0;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    border-bottom: 5px solid var(--mcd-yellow);
}

header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.card {
    background: var(--mcd-card-bg);
    padding: 28px;
    border-radius: 16px;
    margin-bottom: 30px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    border: 1px solid var(--mcd-gray);
}

.card h2 {
    color: var(--mcd-red);
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    font-weight: 800;
}

.card h2::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 22px;
    background-color: var(--mcd-yellow);
    margin-right: 10px;
    border-radius: 4px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--mcd-dark-gray);
}

input, select {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--mcd-gray);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s ease;
    background-color: #FAFAFA;
}

input:focus, select:focus {
    border-color: var(--mcd-yellow);
    background-color: #FFF;
}

button {
    border: none;
    border-radius: 25px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

button:active {
    transform: scale(0.98);
}

.btn-primary {
    background-color: var(--mcd-red);
    color: white;
}
.btn-primary:hover {
    background-color: var(--mcd-dark-red);
}

.btn-accent {
    background-color: var(--mcd-yellow);
    color: var(--mcd-text);
    padding: 8px 16px;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 20px;
    line-height: 1;
}
.btn-accent:hover {
    background-color: #e5a800;
}

.btn-search {
    background-color: var(--mcd-text);
    color: white;
}

.btn-excel {
    background-color: #278036;
    color: white;
}

.btn-edit {
    background-color: var(--mcd-yellow);
    color: var(--mcd-text);
    padding: 6px 12px;
    font-size: 13px;
}

.btn-delete {
    background-color: var(--mcd-red);
    color: white;
    padding: 6px 12px;
    font-size: 13px;
}

.menu-section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 10px;
}

.menu-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--mcd-gray);
}

table th {
    background-color: var(--mcd-red);
    color: white;
    font-weight: 700;
    padding: 14px;
}

table td {
    padding: 12px;
    border-bottom: 1px solid var(--mcd-gray);
    text-align: center;
    font-size: 14px;
}

table tr:last-child td {
    border-bottom: none;
}

table tr:nth-child(even) {
    background-color: #FCFCFC;
}

.summary-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.summary-box {
    padding: 20px;
    border-radius: 12px;
    background: #FFF8E7;
    border: 1px solid var(--mcd-yellow);
}

.summary-box h3 {
    margin-top: 0;
    color: var(--mcd-red);
    font-size: 16px;
    border-bottom: 2px solid var(--mcd-yellow);
    padding-bottom: 8px;
}

.summary-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 14px;
}

.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background: white;
    padding: 25px;
    border-radius: 16px;
    width: 90%;
    max-width: 500px;
}
</style>
</head>
<body>

<header>
    <h1>외식운영팀 식대 관리 System</h1>
</header>

<div class="container">

<div class="card">
    <h2>식사 등록</h2>
    
    <div class="grid">
        <div class="form-group">
            <label>식사 날짜 *</label>
            <input type="date" id="mealDate">
        </div>
        <div class="form-group">
            <label>소속매장 *</label>
            <select id="homeStore"></select>
        </div>
        <div class="form-group">
            <label>직원명 *</label>
            <input type="text" id="employeeName" placeholder="직원 이름 입력">
        </div>
        <div class="form-group">
            <label>식사매장 *</label>
            <select id="mealStore" onchange="changeMainMenuType()"></select>
        </div>
        <div class="form-group">
            <label>금액 *</label>
            <input type="number" id="amount" min="0" placeholder="0">
        </div>
    </div>

    <div class="menu-section-header">
        <label style="font-weight:bold;">메뉴 정보</label>
        <button type="button" class="btn-accent" onclick="addMenu()" title="메뉴 추가">+</button>
    </div>

    <div id="menuContainer"></div>

    <br>
    <button class="btn-primary" style="width: 100%; font-size: 18px;" onclick="saveMeal()">식사 등록하기</button>
</div>

<div class="card">
    <h2>관리자 조회 및 수정</h2>

    <div class="grid">
        <div class="form-group">
            <label>시작일</label>
            <input type="date" id="searchStart">
        </div>
        <div class="form-group">
            <label>종료일</label>
            <input type="date" id="searchEnd">
        </div>
        <div class="form-group">
            <label>소속매장</label>
            <select id="searchStore">
                <option value="">전체 매장</option>
            </select>
        </div>
    </div>

    <br>
    <div style="display: flex; gap: 10px;">
        <button class="btn-search" onclick="searchData()">조회하기</button>
        <button class="btn-excel" onclick="downloadExcel()">엑셀 다운로드</button>
    </div>

    <div class="summary-container">
        <div class="summary-box">
            <h3>직원별 사용금액 Summary</h3>
            <div id="employeeSummary">-</div>
        </div>
        <div class="summary-box">
            <h3>식사매장별 사용금액 Summary</h3>
            <div id="mealStoreSummary">-</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>식사 날짜</th>
                <th>소속매장</th>
                <th>직원명</th>
                <th>식사매장</th>
                <th>메뉴명</th>
                <th>금액</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
</div>

</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3 style="color:var(--mcd-red); margin-top:0;">등록 정보 수정</h3>
        <input type="hidden" id="editId">
        
        <div class="form-group" style="margin-bottom:10px;">
            <label>식사 날짜</label>
            <input type="date" id="editMealDate">
        </div>
        <div class="form-group" style="margin-bottom:10px;">
            <label>직원명</label>
            <input type="text" id="editEmployeeName">
        </div>
        <div class="form-group" style="margin-bottom:10px;">
            <label>메뉴명</label>
            <input type="text" id="editMenuName">
        </div>
        <div class="form-group" style="margin-bottom:15px;">
            <label>금액</label>
            <input type="number" id="editAmount">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn-search" onclick="closeEditModal()">취소</button>
            <button class="btn-primary" onclick="submitEdit()">수정 완료</button>
        </div>
    </div>
</div>

<script>
// Supabase 접속 정보 대입 완료
const SUPABASE_URL = 'https://uttlxkikvdiaqlchrsnt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Tsh7NFNO-I5_gfsR01ArSQ_X9NSS_MW';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const ADMIN_PW = "1234";

const stores = [
    "이스트키친","소희원","루이","드래프트","온미",
    "쿠차라","스시다이몬","뮤제오","아우어",
    "던킨","스위트랩","카페바이랩","외식운영팀"
];

const mealStores = [
    "여의반상","도쿄다이몬","곡분","럭키분식","터프버거",
    "셀프라면","데일리팟","온미","쿠차라",
    "스시다이몬","소희원","루이",
    "드래프트","아우어","던킨",
    "기타외부 및 편의점"
];

const menuMap = {
    "여의반상":["김치찌개","찜닭","돼지국밥","제육볶음"],
    "도쿄다이몬":["등심카츠","안심카츠","일식커리"],
    "곡분":["열무국수","마라탕","배빔국수","돈코츠라멘"],
    "럭키분식":["건강포케","김밥깐풍기","김밥떡볶이","나시고랭"],
    "터프버거":["베이컨버거","치즈버거","치킨버거","새우버거"]
};

let currentResult = [];

function initialize(){
    stores.forEach(store => {
        homeStore.innerHTML += `<option value="${store}">${store}</option>`;
        searchStore.innerHTML += `<option value="${store}">${store}</option>`;
    });

    mealStores.forEach(store => {
        mealStore.innerHTML += `<option value="${store}">${store}</option>`;
    });

    changeMainMenuType();
    searchData();
}

function createMainMenuField(){
    const store = mealStore.value;
    if(menuMap[store]){
        let html = `<select class="menu-input main-menu">`;
        menuMap[store].forEach(menu => {
            html += `<option value="${menu}">${menu}</option>`;
        });
        html += `</select>`;
        return html;
    }
    return `<input type="text" class="menu-input main-menu" placeholder="메뉴 입력 (선택)">`;
}

function changeMainMenuType(){
    const container = document.getElementById("menuContainer");
    container.innerHTML = `<div class="menu-row">${createMainMenuField()}</div>`;
}

function addMenu(){
    const div = document.createElement("div");
    div.className = "menu-row";
    div.innerHTML = `<input type="text" class="menu-input" placeholder="추가 메뉴 입력 (선택)">`;
    document.getElementById("menuContainer").appendChild(div);
}

// Supabase DB 저장
async function saveMeal(){
    const date = mealDate.value;
    const store = homeStore.value;
    const employee = employeeName.value.trim();
    const meal = mealStore.value;
    const amountValue = amount.value;

    const menuInputs = document.querySelectorAll(".menu-input");
    let menus = [];

    menuInputs.forEach(item => {
        const val = item.value.trim();
        if(val !== ""){
            menus.push(val);
        }
    });

    if(!date || !store || !employee || !meal || !amountValue){
        alert("필수 정보(날짜, 소속매장, 직원명, 식사매장, 금액)를 입력해주세요.");
        return;
    }

    const { error } = await _supabase
        .from('meals')
        .insert([{
            meal_date: date,
            home_store: store,
            employee_name: employee,
            meal_store: meal,
            menu_name: menus.join(", "),
            amount: Number(amountValue)
        }]);

    if(error){
        alert("저장 중 오류가 발생했습니다: " + error.message);
        return;
    }

    alert("식대 정보가 성공적으로 등록되었습니다.");

    mealDate.value = "";
    employeeName.value = "";
    amount.value = "";
    changeMainMenuType();
    searchData();
}

// Supabase DB 조회
async function searchData(){
    const start = searchStart.value;
    const end = searchEnd.value;
    const store = searchStore.value;

    let query = _supabase.from('meals').select('*').order('meal_date', { ascending: false });

    if(start) query = query.gte('meal_date', start);
    if(end) query = query.lte('meal_date', end);
    if(store) query = query.eq('home_store', store);

    const { data, error } = await query;

    if(error){
        console.error("조회 실패:", error);
        return;
    }

    currentResult = data || [];
    const tbody = document.getElementById("resultBody");
    tbody.innerHTML = "";

    currentResult.forEach(item => {
        tbody.innerHTML += `
        <tr>
            <td>${item.meal_date}</td>
            <td>${item.home_store}</td>
            <td>${item.employee_name}</td>
            <td>${item.meal_store}</td>
            <td>${item.menu_name || '-'}</td>
            <td>${Number(item.amount).toLocaleString()}원</td>
            <td>
                <button class="btn-edit" onclick="openEditModal(${item.id})">수정</button>
                <button class="btn-delete" onclick="deleteRecord(${item.id})">삭제</button>
            </td>
        </tr>
        `;
    });

    createSummary(currentResult);
}

function openEditModal(id) {
    const password = prompt("수정하려면 관리자 비밀번호를 입력하세요.");
    if (password !== ADMIN_PW) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
    }

    const item = currentResult.find(x => x.id === id);
    if (!item) return;

    document.getElementById("editId").value = item.id;
    document.getElementById("editMealDate").value = item.meal_date;
    document.getElementById("editEmployeeName").value = item.employee_name;
    document.getElementById("editMenuName").value = item.menu_name || '';
    document.getElementById("editAmount").value = item.amount;

    document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
}

// Supabase DB 수정
async function submitEdit() {
    const id = Number(document.getElementById("editId").value);
    
    const { error } = await _supabase
        .from('meals')
        .update({
            meal_date: document.getElementById("editMealDate").value,
            employee_name: document.getElementById("editEmployeeName").value.trim(),
            menu_name: document.getElementById("editMenuName").value.trim(),
            amount: Number(document.getElementById("editAmount").value)
        })
        .eq('id', id);

    if(error){
        alert("수정 실패: " + error.message);
        return;
    }

    alert("수정이 완료되었습니다.");
    closeEditModal();
    searchData();
}

// Supabase DB 삭제
async function deleteRecord(id){
    const password = prompt("삭제 비밀번호를 입력하세요.");

    if(password !== ADMIN_PW){
        alert("비밀번호가 일치하지 않습니다.");
        return;
    }

    const { error } = await _supabase
        .from('meals')
        .delete()
        .eq('id', id);

    if(error){
        alert("삭제 실패: " + error.message);
        return;
    }

    alert("삭제 완료");
    searchData();
}

function createSummary(data){
    const empTotal = {};
    const mealTotal = {};

    data.forEach(item => {
        empTotal[item.employee_name] = (empTotal[item.employee_name] || 0) + Number(item.amount);
        mealTotal[item.meal_store] = (mealTotal[item.meal_store] || 0) + Number(item.amount);
    });

    let empHtml = "";
    for(let key in empTotal){
        empHtml += `<div class="summary-item"><span>${key}</span> <b>${empTotal[key].toLocaleString()}원</b></div>`;
    }

    let mealHtml = "";
    for(let key in mealTotal){
        mealHtml += `<div class="summary-item"><span>${key}</span> <b>${mealTotal[key].toLocaleString()}원</b></div>`;
    }

    employeeSummary.innerHTML = empHtml || "조회결과 없음";
    mealStoreSummary.innerHTML = mealHtml || "조회결과 없음";
}

function downloadExcel(){
    if(currentResult.length === 0){
        alert("조회된 데이터가 없습니다.");
        return;
    }

    let csv = "식사날짜,소속매장,직원명,식사매장,메뉴명,금액\n";
    currentResult.forEach(item => {
        csv += `${item.meal_date},${item.home_store},${item.employee_name},${item.meal_store},"${item.menu_name || ''}",${item.amount}\n`;
    });

    const blob = new Blob(["\ufeff" + csv], {type: "text/csv;charset=utf-8;"});
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `식대정보_${new Date().getTime()}.csv`;
    a.click();
    window.URL.revokeObjectURL(url);
}

initialize();
</script>

</body>
</html>
